name: Windows build and tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: musicboard-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check out pinned native update helper source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FullPeople/FullOffice
          ref: 184cd8ed6d0b561e66fa13572853082c04310d45
          path: .cache/shared-fulltools
      - name: Verify public source digests and release signature
        run: python tools/build_media_runtime.py --verify-sources-only
      - name: Configure
        run: cmake --preset windows-x64
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release --output-on-failure
      - name: Reuse exact published source-matched runtime and verify every component
        run: python tools/reuse_verified_media_runtime.py
      - name: Verify online audio and native import controls
        run: |
          Copy-Item -LiteralPath '.cache/media-tools' -Destination 'build/windows-x64/Release/media-tools' -Recurse
          python tools/verify_online_audio.py
          python tools/verify_online_handoff_delay.py --decoder --exe build/windows-x64/Release/online_handoff_tests.exe --tools .cache/media-tools --fixture artifacts/online-validation/tone.wav --output-root artifacts/online-handoff-delay
      - name: Build native update helper
        shell: pwsh
        run: |
          cmake -S .cache/shared-fulltools/src/FullTools.Distribution -B .cache/update-helper
          if ($LASTEXITCODE -ne 0) { throw 'Update helper configuration failed' }
          cmake --build .cache/update-helper --config Release --target FullToolsUpdater --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Update helper build failed' }
          Copy-Item -LiteralPath '.cache/update-helper/Release/FullToolsUpdater.exe' -Destination 'build/windows-x64/Release/FullToolsUpdater.exe'
      - name: Package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package_release.ps1 -Version 0.3.6
      - name: Build and verify the native installation wizard
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/FullPeople/MusicBoard/releases/download/v0.3.5/MusicBoard-0.3.5-windows-x64.zip' -OutFile '.cache/installer-base.zip'
          python tools/prepare_wizard_payload.py --base .cache/installer-base.zip --build-directory build/windows-x64/Release --output artifacts/packages/MusicBoard-0.3.6-wizard.1-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Verified wizard payload preparation failed' }
          cmake -S . -B build/windows-x64 '-DPAYLOAD_ZIP=${{ github.workspace }}/artifacts/packages/MusicBoard-0.3.6-wizard.1-windows-x64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'Wizard configuration failed' }
          cmake --build build/windows-x64 --config Release --target musicboard_installer musicboard_extraction_probe actual_package_install_probe --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Wizard build failed' }
          python tools/verify_wizard_staging.py --archive artifacts/packages/MusicBoard-0.3.6-wizard.1-windows-x64.zip --probe build/windows-x64/src/distribution/Release/MusicBoardExtractionProbe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Wizard staging checks failed' }
          python tools/verify_installer_wizard.py --installer build/windows-x64/src/distribution/Release/MusicBoardInstaller.exe --payload artifacts/packages/MusicBoard-0.3.6-wizard.1-windows-x64.zip --base .cache/installer-base.zip --transaction-probe build/windows-x64/Release/actual_package_install_probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Isolated wizard installation checks failed' }
          python tools/make_portable_zip.py --payload artifacts/packages/MusicBoard-0.3.6-wizard.1-windows-x64.zip --output dist/MusicBoard-0.3.6-windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Portable package preparation failed' }
          Copy-Item -LiteralPath 'build/windows-x64/src/distribution/Release/MusicBoardInstaller.exe' -Destination 'dist/MusicBoard-0.3.6-Setup-windows-x64.exe'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MusicBoard-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: MusicBoard-online-validation
          path: |
            artifacts/online-validation/report.json
            artifacts/online-validation/*.log
            artifacts/online-handoff-delay/**/*.json
            artifacts/online-handoff-delay/**/*.log
          if-no-files-found: warn
