name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure
        run: cmake --preset windows-x64
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release --output-on-failure
      - name: Package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/package_release.ps1 -Version 0.2.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MusicBoard-windows-x64
          path: dist/*.zip
